[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legallm"
version = "0.1.0"
description = "Benchmark-grade legal facts dataset pipeline for citation prediction research"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Noah M" },
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pypdf>=4.0",
    "PyMuPDF>=1.24",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests>=2.31",
]

[project.scripts]
legallm = "legallm.cli:main"
legallm-eval = "legallm.eval_cli:main"
legallm-extract = "legallm.single_doc:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",    # OcrDecisionConfig() as default arg is safe (frozen dataclass)
    "SIM102",  # nested ifs are sometimes clearer for readability
    "SIM103",  # explicit return True/False is clearer for multi-condition logic
    "SIM105",  # contextlib.suppress is less readable in cleanup contexts
    "B007",    # unused loop variables in tuple unpacking are fine
    "B011",    # assert False in tests is fine for "should not reach here" patterns
]

[tool.ruff.lint.isort]
known-first-party = ["legallm"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
