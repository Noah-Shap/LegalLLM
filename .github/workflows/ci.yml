name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # weekly drift check: Monday 09:00 UTC, same smoke gate
  workflow_dispatch:
    inputs:
      methods:
        description: "methods for the smoke gate (space-separated)"
        default: "rules_v2 llm-v2 llm-v3 llm-v4 llm-v5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/legallm/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --cov=legallm --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          file: ./coverage.xml

  # C13 regression gate: offline smoke eval (recorded model responses in tests/fixtures/xeval_smoke/responses.jsonl)
  # compared with evals/ci/smoke_baseline.json. Fails the build on IoU -2 pts / fidelity -1 pt / any error.
  gate:
    runs-on: ubuntu-latest
    # independent of the test job so a regression reports on both axes (unit tests and eval metrics)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: smoke regression gate
        run: legallm-gate --methods ${{ github.event.inputs.methods || 'rules_v2 llm-v2 llm-v3 llm-v4 llm-v5' }} --summary-out gate.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-summary
          path: gate.md
